[versions]
kotlin = "2.3.20"
kotlinLombokPlugin = "2.1.20"
compose = "1.9.3"
lombokPlugin = "9.5.0"
javafxplugin = "0.1.0"
foojay = "1.0.0"
slf4j = "2.0.18"
jspecify = "1.0.1"
jetbrainsAnnotations = "26.0.2"
junit = "6.1.3"
jdbi3 = "3.49.0"
sqlite = "3.53.4.0"
jgit = "7.7.1.202607240634-r"
picocli = "4.7.7"
javaparser = "3.28.2"
lyricist = "1.8.0"

[libraries]
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
jspecify = { module = "org.jspecify:jspecify", version.ref = "jspecify" }
jetbrains-annotations = { module = "org.jetbrains:annotations", version.ref = "jetbrainsAnnotations" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jdbi3-core = { module = "org.jdbi:jdbi3-core", version.ref = "jdbi3" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite" }
jgit = { module = "org.eclipse.jgit:org.eclipse.jgit", version.ref = "jgit" }
picocli = { module = "info.picocli:picocli", version.ref = "picocli" }
javaparser-core = { module = "com.github.javaparser:javaparser-core", version.ref = "javaparser" }
lyricist = { module = "cafe.adriel.lyricist:lyricist", version.ref = "lyricist" }
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-lombok = { id = "org.jetbrains.kotlin.plugin.lombok", version.ref = "kotlinLombokPlugin" }
compose = { id = "org.jetbrains.compose", version.ref = "compose" }
lombok = { id = "io.freefair.lombok", version.ref = "lombokPlugin" }
javafxplugin = { id = "org.openjfx.javafxplugin", version.ref = "javafxplugin" }
